# zfs-snap-clean.conf — Retention rules for ZFS snapshot cleanup

# ---------------------------------------------------------------------------
# Log directory — overrides the default (logs/ next to the script).
# Set to empty string to disable file logging entirely.
# A timestamped file zfs-snap-clean-YYYYMMDD-HHMMSS.log is created per run.
# ---------------------------------------------------------------------------
# LOG_DIR=""                        # disable
# LOG_DIR="/var/log/zfs-snap-clean" # custom path

# ---------------------------------------------------------------------------
# Default retention counts (0 = keep none, -1 = keep all)
# ---------------------------------------------------------------------------
RETAIN_HOURLY=20
RETAIN_DAILY=10
RETAIN_WEEKLY=8
RETAIN_MONTHLY=12
RETAIN_YEARLY=5

# ---------------------------------------------------------------------------
# Separator between the frequency prefix and the rest of the snapshot name.
# Examples: "daily.2026-03-09" → SNAP_SEP="."
#           "daily-2026-03-09" → SNAP_SEP="-"
#           "daily"            → SNAP_SEP=""  (prefix only, no suffix)
# ---------------------------------------------------------------------------
SNAP_SEP="."

# ---------------------------------------------------------------------------
# Snapshot name prefixes mapped to each frequency.
# Patterns are matched as: <prefix><SNAP_SEP><anything>  or  <prefix> alone.
# Add or rename entries to match your snapshot naming convention.
# ---------------------------------------------------------------------------
declare -A FREQ_PREFIXES=(
    [hourly]="hourly"
    [daily]="daily"
    [weekly]="weekly"
    [monthly]="monthly"
    [yearly]="yearly"
)

# ---------------------------------------------------------------------------
# Per-filesystem retention overrides.
# Key   : exact ZFS filesystem name (no leading pool slash needed).
# Value : space-separated KEY=VALUE pairs; valid keys are
#         HOURLY  DAILY  WEEKLY  MONTHLY  YEARLY
#
# Examples (uncomment and adapt):
# ---------------------------------------------------------------------------
declare -A FS_OVERRIDES
# FS_OVERRIDES["tank/important"]="DAILY=30 HOURLY=48 WEEKLY=12"
# FS_OVERRIDES["tank/archive"]="DAILY=14 MONTHLY=24 YEARLY=-1"
# FS_OVERRIDES["rpool/ROOT/ubuntu"]="DAILY=7 HOURLY=0"

# ---------------------------------------------------------------------------
# Minimum age protection per frequency.
# A snapshot younger than this threshold is never deleted, even if it exceeds
# the retention count.  Set to 0 or leave empty to disable.
# Format: <number><unit>  — units: h=hours  d=days  w=weeks  m=months  y=years
# ---------------------------------------------------------------------------
MIN_AGE_HOURLY=4h
#MIN_AGE_DAILY=2d
MIN_AGE_DAILY=0d
MIN_AGE_WEEKLY=2w
MIN_AGE_MONTHLY=2m
MIN_AGE_YEARLY=1y
